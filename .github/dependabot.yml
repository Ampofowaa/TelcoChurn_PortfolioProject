version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ current: each PR bumps
  # the commit SHA and the trailing version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Bumps the pinned uv tag+digest and base images in the three Dockerfiles.
  - package-ecosystem: "docker"
    directories:
      - "/docker/api"
      - "/docker/ui"
      - "/docker/mlflow"
    schedule:
      interval: "weekly"
    # The MLflow server image must move in lockstep with uv.lock's mlflow (see
    # docker/mlflow/Dockerfile): a server-only bump migrates the shared
    # tracking database out from under the 3.x clients. Upgraded by hand,
    # both sides in one PR.
    ignore:
      - dependency-name: "mlflow/mlflow"
