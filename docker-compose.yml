services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-telco_churn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telco} -d ${POSTGRES_DB:-telco_churn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlruns:/mlruns/artifacts
    environment:
      # MLflow 3.14's server-side DNS-rebinding guard only allowlists
      # 'localhost' and private-IP literals by default — the Compose DNS
      # name 'mlflow' that fastapi/streamlit reach this service through
      # doesn't match either pattern and gets a 403 ("Invalid Host header")
      # without this. is_allowed_host_header() does an exact string match
      # unless the entry itself contains '*', and the actual Host header is
      # 'mlflow:5000' (hostname:port) — so the bare 'mlflow' entry alone
      # never matches; the 'mlflow:*' wildcard is what actually clears it.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:*,mlflow,localhost:*,localhost"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-telco}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlruns/artifacts
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # start_period: MLflow's uvicorn workers observably die and respawn once
      # on a cold start (a transient race, not a real failure — confirmed via
      # `docker logs`: the first worker exits within ~6s, then a full,
      # healthy startup completes ~60-70s later) before "Application startup
      # complete" actually lands. Without this, interval(10s) x retries(6) =
      # ~60s gives the healthcheck no margin against that observed worst
      # case, so `docker compose up --build` intermittently gave up with
      # "dependency mlflow failed to start" moments before mlflow would have
      # reported healthy on its own — confirmed by re-running plain `docker
      # compose up -d fastapi streamlit` immediately after, with no rebuild,
      # which always succeeded once mlflow had caught up. Failing checks
      # during start_period don't count against retries or mark the
      # container unhealthy, so this removes the race without masking a
      # genuine failure — retries still apply in full once start_period ends.
      start_period: 90s

  fastapi:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-telco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telco_churn}
      API_KEY: ${API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6

  streamlit:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      # Compose gives every service a DNS name equal to its service key on
      # the shared network — fastapi is reachable at this hostname with no
      # extra wiring. streamlit_app.py falls back to http://localhost:8000
      # for a bare `streamlit run` outside Compose.
      API_BASE_URL: http://fastapi:8000
      # Host-facing counterpart to API_BASE_URL, display-only (see
      # streamlit_app.py's API_DISPLAY_URL comment) — fastapi's internal
      # DNS name above isn't reachable from the browser rendering this
      # page, but its published port mapping (ports:, above) is.
      API_DISPLAY_URL: http://localhost:${API_PORT:-8000}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
