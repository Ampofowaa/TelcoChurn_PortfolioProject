repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, src/]
        pass_filenames: false
        # Needed for real import resolution now that pyproject.toml's mypy
        # override is scoped to the handful of libraries that actually lack
        # stubs/py.typed, not a blanket ignore_missing_imports — mypy's
        # isolated hook env otherwise can't see any of the project's runtime
        # deps and reports every one of them as import-not-found. Mirrors
        # [project.dependencies]; pytest/nbformat are hook-only extras.
        additional_dependencies:
          [
            pytest,
            nbformat,
            hydra-core,
            lightgbm==4.6.0, # pinned: unpinned resolves a newer lightgbm whose
            # predict_proba stub types the return as list, not ndarray, and
            # X[:, 1] doesn't typecheck against list — a hook-env-only false
            # positive absent under the version this project actually locks.
            matplotlib,
            numpy,
            optuna,
            pandas,
            psycopg2-binary,
            python-dotenv,
            scikit-learn,
            scipy,
            sqlalchemy,
            structlog,
            pandera,
            mlflow,
            pyarrow,
            shap,
          ]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--keep-id]
        # _archive/ and numbered presentation notebooks (00-, 01-, 02a-, …) keep
        # their outputs for GitHub browsing. Unnumbered scratch notebooks are stripped.
        exclude: ^notebooks/(_archive/|0[0-9][a-z]?-)

  - repo: local
    hooks:
      - id: upgrade-notebooks
        name: upgrade notebooks to nbformat 4.5
        entry: python scripts/upgrade_notebooks.py
        language: python
        types: [jupyter]
        additional_dependencies: [nbformat]

      - id: fix-notebook-outputs
        name: coalesce fragmented notebook stream outputs
        entry: python scripts/fix_notebook_outputs.py
        language: python
        types: [jupyter]
        additional_dependencies: [nbformat]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # configs/policy/threshold.yaml is machine-generated (OmegaConf.save, no
        # comments preserved) and always carries a costs_config_hash sha256 hex
        # digest by design — a false-positive high-entropy-string hit on every
        # regeneration, not a secret. An inline `pragma: allowlist secret` would
        # be silently wiped by the next `threshold.py` run, so it's excluded here
        # instead.
        # Notebooks that keep their outputs (same 00-/01-/0[a-z]-/… set nbstripout
        # exempts, see that hook's exclude below) embed matplotlib figures as
        # base64-encoded PNG cell output — always high-entropy, never a secret,
        # and an inline pragma can't reach inside embedded JSON cell output.
        exclude: \.secrets\.baseline|configs/policy/threshold\.yaml|notebooks/(_archive/|0[0-9][a-z]?-)
