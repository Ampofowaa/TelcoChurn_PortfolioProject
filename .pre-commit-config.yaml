repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--keep-id]
        # _archive/ and numbered presentation notebooks (00-, 01-, 02a-, …) keep
        # their outputs for GitHub browsing. Unnumbered scratch notebooks are stripped.
        exclude: ^notebooks/(_archive/|0[0-9][a-z]?-)

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml src/
        language: system
        pass_filenames: false
        types: [python]
        # Runs inside the project's own uv-managed venv instead of an
        # isolated pre-commit environment. The isolated mirrors-mypy hook
        # needed a hand-maintained additional_dependencies list mirroring
        # every package src/ imports (base deps + all three
        # [project.optional-dependencies] extras — serving/ui/training all
        # type-check as one src/ tree) and had drifted stale more than once
        # as those extras grew; installing that list from scratch is also
        # slow enough on a fresh cache to time out a CI/commit step. `uv run`
        # reuses the venv this project already maintains for every other
        # command in this file (ruff, pytest, dvc repro, ...), so there is
        # nothing left to keep in sync by hand.
        require_serial: true

      - id: upgrade-notebooks
        name: upgrade notebooks to nbformat 4.5
        entry: python scripts/upgrade_notebooks.py
        language: python
        types: [jupyter]
        additional_dependencies: [nbformat]

      - id: fix-notebook-outputs
        name: coalesce fragmented notebook stream outputs
        entry: python scripts/fix_notebook_outputs.py
        language: python
        types: [jupyter]
        additional_dependencies: [nbformat]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Every reports/ receipt/summary file (ingest_receipt.json,
        # validation_receipt.json, metrics_summary.json, promotion_decision.json,
        # policy/threshold.yaml, ...) is machine-generated and always carries at
        # least one sha256 hex digest by design — git SHA, data_content_hash,
        # costs_config_hash, metrics_content_hash — a false-positive
        # high-entropy-string hit on every regeneration, not a secret. An inline
        # `pragma: allowlist secret` would be silently wiped by the next pipeline
        # run, so the whole directory is excluded here instead of enumerating
        # each file (which would need updating every time a new receipt is
        # added).
        # Notebooks that keep their outputs (same 00-/01-/0[a-z]-/… set nbstripout
        # exempts, see that hook's exclude below) embed matplotlib figures as
        # base64-encoded PNG cell output — always high-entropy, never a secret,
        # and an inline pragma can't reach inside embedded JSON cell output.
        exclude: \.secrets\.baseline|reports/|notebooks/(_archive/|0[0-9][a-z]?-)
