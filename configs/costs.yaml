# Cost-scenario parameters — see models/threshold.py.
gross_margin: 0.60    # telecom benchmark 55-65%
horizon_months: 12    # 1-year LTV evaluation horizon
discount_months: 3    # standard retention-offer term

# Average Revenue Per User (ARPU) quantile per scenario, computed from development-set churner MonthlyCharges.
arpu_quantile:
  conservative: 0.25
  base: 0.50
  optimistic: 0.75

scenarios:
  conservative:
    outreach_cost: 5        # automated email/SMS
    discount_rate: 0.10
    retention_rate: 0.20    # industry benchmark — not observable in this dataset
  base:
    outreach_cost: 20       # call-centre agent
    discount_rate: 0.20     # typical telecom offer
    retention_rate: 0.30
  optimistic:
    outreach_cost: 50       # retention specialist
    discount_rate: 0.30
    retention_rate: 0.40

# r-sensitivity sweep — base-scenario cost/LTV held fixed, retention_rate varied alone.
retention_rate_sweep: [0.15, 0.20, 0.30, 0.40, 0.45]

# Retention-team operational limits, per campaign cycle. Illustrative, not a
# measured operational number — this dataset has no capacity data, so these
# share retention_rate's status as a benchmark guess rather than an estimate.
# When implied_contact_rate * customer_base exceeds contact_capacity (or the
# implied spend exceeds campaign_budget), the correct policy is top-K by
# expected value, not a higher threshold — see models/threshold.py's
# docstring and Phase 7's evaluate.py capacity check.
contact_capacity: 500       # customers a retention team can contact per cycle
campaign_budget: 15_000     # dollars available per cycle

# Bootstrap resamples for the empirical argmax-EV agreement-check CI.
argmax_ev_bootstrap_n_samples: 1_000
