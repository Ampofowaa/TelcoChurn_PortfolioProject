# Calibration study configuration — see models/calibrate.py.

# sigmoid | isotonic | auto — pinned to the resolved winner (isotonic_disqualified_pr_auc_gate;
# ANALYSIS.md §5). Re-run 'auto' and re-pin if the tuned pipeline changes materially.
method: sigmoid

# cross_val_predict(cv=outer) fold count — explicit shuffle+seed, unlike the unshuffled cv=5 default.
outer_cv_folds: 5

# CalibratedClassifierCV(cv=inner) fold count.
inner_cv_folds: 5

shuffle: true
random_state: 42

# Sigmoid-vs-isotonic gate metric — mean of per-fold AP, never pooled, against training_setup.delta_threshold.
gate_metric: per_fold_mean_pr_auc

# Block-bootstrap (by outer fold, not row) resamples for the paired ΔBrier CI.
brier_bootstrap_n_samples: 10_000

# Row-resample bootstrap for the dev-OOF calibration slope's CI — a diagnostic,
# not the family-decision bootstrap, hence the smaller count (matches
# comparison.py's _FAMILY_REVIEW_SEGMENT_N_BOOTSTRAP cost/precision tradeoff).
slope_bootstrap_n_samples: 1_000

# Expected Calibration Error (ECE) binning — gates nothing, just needs to be comparable across runs.
ece_n_bins: 10
ece_strategy: quantile

# tuning_study run_id to calibrate — e.g. `calibration.run_id=<id>` on the CLI.
# Falls back to reports/train_receipt.json (written by models.train) when null.
# Never inferred from mlflow "latest" — only an explicit override or the receipt.
run_id: null

# Rows in the golden-parity fixture (golden_predictions.json) — the lowest
# n_rows customerid values in the dev partition, pinned for register.py's
# serving-parity smoke check (Phase 7) and Phase 9's API parity test. Same
# rows also serve as the logged model's signature input_example.
golden_n_rows: 5

# Force registration even if trial_count_below_threshold is true in training_manifest.json.
override_trial_count_gate: false
