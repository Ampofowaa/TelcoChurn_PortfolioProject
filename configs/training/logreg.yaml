# LogisticRegressionCV parameters for the candidate comparison (Dummy vs. LogReg vs. LightGBM).
# Comparison-only — never registered, calibrated, or served.
# class_weight lives in config.yaml training_setup — shared across all model families.

Cs: 10              # number of C values on sklearn's default log-scale grid, not a literal C=10
cv_folds: 5         # inner CV, runs inside each outer RSKF fold
max_iter: 200       # above sklearn default of 100 — avoids silent ConvergenceWarnings
solver: lbfgs       # supports L2 on dense data without sparse-gradient noise
# 0.0 = pure L2 (stable under correlated predictors: tenure/totalcharges/monthlycharges),
# 1.0 = pure L1. Replaces the 'penalty' string param, deprecated in sklearn 1.8 and
# removed in 1.10 — l1_ratios=(0,) is mathematically identical to penalty='l2'.
l1_ratio: 0.0
