# Permutation-importance feature selector (Phase 5 Step 3) — see features/select.py
# for the selection rule and rescue logic these values feed.

n_repeats: 15
noise_floor_margin: 0.005
inner_val_size: 0.2          # distinct from training_setup.test_size
random_state: 42
bootstrap_n_samples: 10_000   # keep-vs-reduce test only, separate from training_setup's model-comparison bootstrap

# No separate delta_threshold key: the keep-vs-reduce test reuses training_setup.delta_threshold.
correlated_groups:
  - [tenure, totalcharges, monthlycharges]
