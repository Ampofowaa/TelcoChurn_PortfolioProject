defaults:
  - training: lightgbm        # LightGBM fixed knobs → cfg.training
  - training@logreg: logreg   # LogReg comparison params → cfg.logreg
  - training@selection: selection  # selector hyperparams → cfg.selection
  - tuning: optuna         # Optuna study + search space → cfg.tuning
  - calibration: default  # calibration method/CV/ECE knobs → cfg.calibration
  - threshold: default    # threshold derivation knobs → cfg.threshold
  - evaluate: default     # sealed-test evaluation knobs → cfg.evaluate
  - error_analysis: default  # error-diagnosis step knobs → cfg.error_analysis
  # - data: telco          # pending
  # - serving: api         # pending
  - _self_

random_seed: 42

training_setup:
  test_size: 0.2                        # stratified dev/test split fraction
  cv_folds: 10                           # outer RSKF splits (shared with Optuna inner CV)
  cv_repeats: 10                         # RSKF repeats — tightens mean PR-AUC on ~5,600 dev rows
  bootstrap_n_samples: 10000            # paired-bootstrap resamples for Δ CI
  segment_bootstrap_n_samples: 1000     # per-segment paired-bootstrap resamples (flag-only diagnostic, not the family decision — smaller for cost)
  delta_threshold: 0.005                 # Δ*: pre-registered materiality threshold
  fixed_recall_thresholds: [0.70, 0.80, 0.90]  # recall targets for the fixed-recall profile
  class_weight: balanced                # class imbalance handling: up-weights the minority (churn) class; shared by all model families
  cv_n_jobs: -1                          # outer CV-fold parallelism (joblib, -1 = all cores); distinct from training.fixed.n_jobs (LightGBM's own internal threads, pinned to 1 for determinism) — each fold is an independent fit, so running folds concurrently changes wall-clock time only, never the result. Wired into run_selection_cv (feature_freeze.py) only — its ~850 predict_proba calls/fold comfortably amortize joblib's per-call worker-pool overhead. NOT wired into candidates.py's cv_score_candidate calls: each fold there is a single cheap fit (~0.25s), too light for process-based parallelism to pay off on Windows (spawn-based worker startup + per-task dispatch overhead measured ~2x slower than sequential for this workload).

mlflow:
  # Fallback (no .env, infra profile down — fresh clone or CI) must stay a database
  # backend: MLflow's file store is in maintenance mode as of 3.14 and raises on use.
  # sqlite:///mlflow.db is the zero-infra fallback with the same SQLAlchemy feature
  # surface as the served Postgres backend, so local/CI never diverges from it.
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  experiment_name: telco-churn-training
  registered_model_name: telco-churn-pipeline

paths:
  raw_data: datasets/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  interim_data: datasets/interim/
  processed_data: ${oc.env:PROCESSED_DATA_DIR,datasets/processed/}
  sql_features: sql/features
  reports: reports
  feature_discovery_reports: ${paths.reports}/feature_discovery
  validation_reports: ${paths.reports}/validation
  figures: ${paths.reports}/figures
  policy: configs/policy
  costs_config: configs/costs.yaml
  model_promotion_config: configs/model_promotion.yaml

validation:
  min_rows: 1000
  max_null_rate: 0.05

database:
  url: ${oc.env:POSTGRES_URL,postgresql://user:pass@localhost:5432/telco_churn}  # pragma: allowlist secret
