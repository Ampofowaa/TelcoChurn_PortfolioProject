# defaults list — sub-configs are added as each phase is completed
# defaults:
#   - data: telco          # Phase 1
#   - model: lightgbm      # Phase 5
#   - training: optuna     # Phase 5
#   - serving: api         # Phase 9
#   - _self_

random_seed: 42

mlflow:
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,http://localhost:5000}
  experiment_name: telco-churn
  registered_model_name: telco-churn-pipeline

paths:
  raw_data: datasets/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  interim_data: datasets/interim/
  processed_data: ${oc.env:PROCESSED_DATA_DIR,datasets/processed/}
  sql_features: sql/features
  reports: reports
  feature_discovery_reports: ${paths.reports}/feature_discovery
  validation_reports: ${paths.reports}/validation

validation:
  min_rows: 1000
  max_null_rate: 0.05

database:
  url: ${oc.env:POSTGRES_URL,postgresql://user:pass@localhost:5432/telco_churn}  # pragma: allowlist secret
