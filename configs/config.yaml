defaults:
  - training: lightgbm        # LightGBM fixed knobs → cfg.training
  - training@logreg: logreg   # LogReg comparison params → cfg.logreg
  - training@selection: feature_selection  # selector hyperparams → cfg.selection
  - tuning: optuna         # Optuna study + search space → cfg.tuning
  - calibration: default  # calibration method/CV/ECE knobs → cfg.calibration
  - threshold: default    # threshold derivation knobs, incl. the pre-seal dev-OOF screen → cfg.threshold
  - evaluate: default     # sealed-test evaluation knobs → cfg.evaluate
  - error_analysis: default  # error-diagnosis step knobs → cfg.error_analysis
  - review: default       # human promotion-review CLI knobs → cfg.review
  - register: default     # registry promotion knobs → cfg.register
  # - data: telco          # pending
  # - serving: api         # pending
  - _self_

# The dev/test split seed (data/split.py) and the CV-fold seed for models/train/.
# Deliberately NOT the seed the later steps use: calibration/threshold/evaluate/tuning
# each carry their own random_state in configs/<step>/default.yaml, all also 42. Two
# reasons they stay separate despite the shared value. (1) Changing this one redraws
# which customers are sealed into the test set — a one-key change must not be reachable
# from a routine "re-run that bootstrap under a different draw" check, per the
# test-set-touched-once invariant. (2) DVC declares seeds under each stage's `params:`,
# so a single shared key would have to appear in all nine stages and would rerun the
# whole DAG (including a cold Optuna study) on any seed edit. Do not "unify" these by
# writing `random_state: ${random_seed}` in the step configs either — DVC parses those
# files with its own YAML reader and would hash the literal `${random_seed}` string,
# silently un-tracking the param (same defect as the ${oc.env:...} wrapper below).
random_seed: 42

training_setup:
  test_size: 0.2                        # stratified dev/test split fraction
  # cv_folds/cv_repeats/bootstrap_n_samples/segment_bootstrap_n_samples retired:
  # they drove Steps 1-2 (candidates.py/comparison.py), which are notebook-only
  # (notebooks/03a-model-selection.ipynb) as of the model-family freeze —
  # nothing automated calls them, so there is no CLI-override use case. Values
  # now live as module constants (_FAMILY_REVIEW_*) in candidates.py/comparison.py,
  # same pattern configs/training/feature_selection.yaml's bootstrap_n_samples retirement
  # used for features/select.py::ABLATION_N_BOOTSTRAP.
  delta_threshold: 0.005                 # Δ*: pre-registered materiality threshold — also reused by calibrate.py's PR-AUC-preservation gate
  fixed_recall_thresholds: [0.70, 0.80, 0.90]  # recall targets for the fixed-recall profile — also reused by evaluate.py's sealed-test profile
  class_weight: balanced                # class imbalance handling: up-weights the minority (churn) class; shared by all model families

mlflow:
  # Fallback (no .env, infra profile down — fresh clone or CI) must stay a database
  # backend: MLflow's file store is in maintenance mode as of 3.14 and raises on use.
  # sqlite:///mlflow.db is the zero-infra fallback with the same SQLAlchemy feature
  # surface as the served Postgres backend, so local/CI never diverges from it.
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  experiment_name: telco-churn-training
  registered_model_name: telco-churn-pipeline

paths:
  raw_data: datasets/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  interim_data: datasets/interim/
  # Plain literal, not ${oc.env:...}: DVC declares this under the split/features
  # stages' `params:`, and an env-resolved key resolves differently on a dev box
  # than in CI, which thrashes dvc.lock. Overrides go through activate_config()
  # (Hydra CLI overrides), never an env var.
  processed_data: datasets/processed/
  sql_features: sql/features
  reports: reports
  feature_discovery_reports: ${paths.reports}/feature_discovery
  validation_reports: ${paths.reports}/validation
  figures: ${paths.reports}/figures
  policy: configs/policy
  costs_config: configs/costs.yaml
  model_promotion_config: configs/model_promotion.yaml

validation:
  min_rows: 1000
  max_null_rate: 0.05

database:
  url: ${oc.env:POSTGRES_URL,postgresql://user:pass@localhost:5432/telco_churn}  # pragma: allowlist secret
