# Registry promotion configuration — see models/register.py.

# telco-churn-pipeline version whose eval_run_id/gate-criteria tags should be
# re-pointed at a fresh cold-start re-evaluation, e.g.
# `register.refresh_reference_version=3`. The one legitimate use: evaluate.py
# refused a later cycle's comparative gate because this (already-promoted)
# version's historical test_predictions.parquet was computed against a
# processed-features file that no longer matches (data_content_hash drift —
# e.g. a new engineered column, even though this version's own frozen
# feature_columns.txt never reads it). Fix by re-running
# `evaluate.model_version=<this version> evaluate.champion_version=none`
# against the current features file, then pointing this key at the same
# version so refresh_champion_reference can pick up that fresh eval run — see
# its docstring. Does not run the gate and does not move champion/challenger;
# mutually exclusive with model_version/run_id below (an error to give more
# than one).
refresh_reference_version: null

# telco-churn-pipeline version whose threshold_run_id tag should be pointed
# at a costs.yaml-only re-run's fresh MLflow run, e.g.
# `register.threshold_rerun_version=3`. Run
# `python -m telco_churn.models.threshold threshold.rerun_model_version=<this
# version>` first — that produces the fresh run and writes
# reports/threshold_rerun_receipt.json, which this reads. Does not run the
# gate and does not move champion/challenger, same as
# refresh_reference_version above; mutually exclusive with it and with
# model_version/run_id below.
threshold_rerun_version: null

# telco-churn-pipeline version to promote/reject, e.g. `register.model_version=2`
# — the already-registered challenger evaluate.py's promotion_decision.json
# was computed against. Never inferred from the challenger alias.
# Mutually exclusive with run_id below and refresh_reference_version above
# (an error to give more than one): model_version selects the promote/reject
# path (run_registration_step); run_id selects the mint path
# (register_challenger). Giving none of the three also mints, defaulting
# run_id to calibrate.py's own receipt.
model_version: null

# calibrate.py run_id to mint as a new challenger version, e.g.
# `register.run_id=<id>`. Falls back to reports/calibrate_receipt.json (the
# most recent calibrate.py run on this machine) when null and model_version
# is also null. See model_version's comment above for the both/neither rules.
run_id: null

# Require an approved human review before acting. True is the attended default:
# a reviewer stamps the verdict via the review CLI each cycle.
# Phase 10b's monthly unattended retrain (10a-ii resolution, PROJECT_PLAN.md
# Phase 10a-ii "Threshold/guardrail policy resolutions") does NOT simply set
# this false: evaluate.py-bound cycles (rare/cold-start) always require review;
# routine performance_check.py-bound cycles escalate only on a rejection or a
# gate-boundary pass (within one bootstrap SE of the pass/fail line) — a clean
# pass gets zero friction. training_cycle.py computes that per-cycle, this
# static default is only what a manual/direct register.py invocation uses. A
# cold start — no version tagged promotion_status: promoted — must force true
# regardless, since there is no rollback target if the gate admits a bad one.
require_review: true

# Alias the flip targets on a pass. Parameterized rather than hard-coded so
# Phase 10's shadow/canary staging can reuse promote_to_alias() unchanged.
alias: champion

# Absolute tolerance for the golden-parity smoke check (reload vs.
# calibrate.py's logged golden_predictions.json reference scores) — used by
# both register_challenger's mint-time check and run_registration_step's
# pre-/post-flip checks. Only meaningful under a pinned environment (see
# environment_packages below).
golden_atol: 1.0e-9

# Packages compared between the registered model's logged pip requirements and
# what's actually installed, before the golden-parity check runs. A patch-level
# drift in any of these shifts floating-point output in the same 1e-7-1e-9 range
# as golden_atol, with no actual bug present.
environment_packages:
  - numpy
  - scikit-learn
  - lightgbm

# Quantile bin count for drift_reference.py's numeric/score reference
# distributions — matches build_reference's own default.
drift_reference_n_bins: 10
