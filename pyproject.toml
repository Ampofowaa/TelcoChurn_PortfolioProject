[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "telcochurn-portfolioproject"
version = "0.1.0"
description = "Production-grade churn prediction system: Pandera validation, LightGBM + Optuna, MLflow registry, FastAPI serving, Prefect orchestration, AWS deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    # MLflow's S3 artifact repository needs boto3 to actually be installed -
    # it is not a hard mlflow dependency. Needed everywhere an MLflow
    # artifact_location can be s3:// (Phase 12a+): training writes artifacts
    # there, api reads the model, ui reads model_card.json via
    # mlflow.artifacts.load_dict. Base dependency, not extras-gated, since
    # all three of serving/ui/training need it.
    "boto3>=1.35",
    "hydra-core>=1.3.2",
    "lightgbm>=4.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pandera>=0.18",
    # MLflow's tracking client resolves a plain postgresql:// URI (this
    # project's rds-url-mlflow SSM param) to SQLAlchemy's default sync
    # driver - psycopg2, not asyncpg. utils/db.py's own async engine
    # (serving/app.py's customer-lookup routes) is a separate connection
    # entirely and doesn't cover this. Base dependency (not extras-gated):
    # training's DVC stages already needed a sync driver via utils/db.py's
    # get_engine(), api/ui now need it too for the MLflow client itself.
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
serving = [
    "asyncpg>=0.31.0",
    "fastapi>=0.138.1",
    # mlflow-skinny, not full mlflow: api never runs `mlflow server`/`mlflow
    # ui` (that's docker/mlflow/Dockerfile's own image, built from the
    # official upstream image, not this project's dependency tree) - it only
    # ever loads a model and reads artifacts as a tracking *client*. Skinny
    # drops Flask/gunicorn/docker/matplotlib/skops and the other
    # server/UI-only weight (confirmed via a local SqlAlchemyStore-against-
    # Postgres probe: tracking, mlflow.sklearn.log_model/load_model with
    # this project's own cloudpickle serialization_format, mlflow.pyfunc
    # .load_model/.get_model_dependencies, and mlflow.artifacts.load_dict
    # all work under skinny + this extra's own sqlalchemy/alembic/psycopg2
    # base deps, no extra packages needed). training keeps full `mlflow`
    # below for `mlflow ui`/notebook use - both packages resolve together
    # fine since full mlflow itself depends on a matching mlflow-skinny.
    "mlflow-skinny>=3.12.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "shap>=0.44",
    "uvicorn[standard]>=0.49.0",
]
training = [
    "matplotlib>=3.10.9",
    # Full mlflow, not skinny: `mlflow ui`/`mlflow server` (local dev,
    # Makefile's `mlflow ui` target) need the Flask/gunicorn server code
    # skinny excludes. See serving extra's mlflow-skinny comment.
    "mlflow>=3.12.0",
    "optuna>=3.0",
    # Read by features/accessor.py, data/split.py, and the models/ stage
    # modules' own parquet I/O (dev_oof_predictions.parquet,
    # shap_values.parquet, split_manifest.parquet, ...) - never imported by
    # serving/ or ui/, so it doesn't belong in those extras' image footprint.
    "pyarrow>=24.0.0",
    "shap>=0.44",
]
ui = [
    "altair>=5.0",
    # See serving extra's mlflow-skinny comment - same reasoning, ui is a
    # tracking client only (resolve_champion_version, model_card.json via
    # mlflow.artifacts.load_dict), never a server.
    "mlflow-skinny>=3.12.0",
    "requests>=2.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "dvc>=3.67.1",
    "httpx2>=2.10.0",
    "hypothesis>=6.0",
    "ipykernel>=7.2.0",
    "kaggle>=2.2.0",
    "mypy>=2.1.0",
    "nbconvert>=7.17.1",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.15",
    "seaborn>=0.13.2",
    "testcontainers[postgres]>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT", "TRY", "LOG", "PTH"]
ignore = ["E501", "TRY003", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
# The repo-root alembic/ migrations directory makes isort's first-party
# heuristic misclassify the `alembic` library, splitting `from alembic import
# command` from `from alembic.config import Config` into separate groups.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom is `param: T = Depends(...)` in a route signature —
# the call is evaluated once at route-registration time, not per-request,
# so B008's "don't call in argument defaults" mutable-default concern
# doesn't apply. This is ruff's own documented fix for this false positive,
# not a per-line noqa.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["notebooks/", "pipelines/", "tests/"]

[[tool.mypy.overrides]]
module = "pandera.*"
follow_imports = "skip"

# Scoped, not the removed top-level ignore_missing_imports: only these libraries
# actually lack stubs/py.typed (confirmed by running mypy without the blanket
# flag). mlflow, optuna, and lightgbm already ship their own types and are
# checked normally; a typo in one of those import paths still surfaces as a
# real error instead of silently falling back to Any.
[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "scipy",
    "scipy.*",
    "sklearn.*",
    "shap",
    "joblib",
    "yaml",
    "altair",
    "streamlit",
    "streamlit.*",
    "prometheus_client",
    "prometheus_fastapi_instrumentator",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "integration: integration tests that require Docker (pass --run-integration to run)",
]
# Each entry below is a confirmed-benign warning, not an unexamined blanket
# silence — see CHANGELOG/PR history for the investigation. Message patterns
# are matched from the start of the string (regex, unescaped); keep them free
# of literal colons (pytest's ini parser splits the whole line on ":").
filterwarnings = [
    # LogisticRegression stand-ins for LightGBM in test_calibrate.py/test_threshold.py
    # deliberately keep the real, unscaled tree-family ColumnTransformer (they
    # exercise calibrate.py's/threshold.py's own CV-wrapping logic, not model
    # quality) — confirmed this still fires at max_iter=2000. Not reachable from
    # production configs: configs/training/logreg.yaml sets max_iter=200, and
    # scales the data via the real preprocessing pipeline these test stand-ins skip.
    "ignore:lbfgs failed to converge:sklearn.exceptions.ConvergenceWarning",
    # mlflow 3.14's own dataset digest computation still calls DataFrame.map(...).all(0)
    # positionally; nothing in this project touches that call site. Scoped to mlflow's
    # own module so a genuine Pandas4Warning from this project's own pandas code (e.g.
    # once pandas 4 actually ships) still surfaces instead of being swallowed here too.
    "ignore::pandas.errors.Pandas4Warning:mlflow.*",
    # mlflow.data.from_pandas's source-type registry reports the same source
    # string as matching two internally-duplicated LocalArtifactDatasetSource
    # registrations and self-resolves the ambiguity; not something callers can
    # disambiguate from the public from_pandas API.
    "ignore:The specified dataset source can be interpreted in multiple ways:UserWarning",
    # mlflow's schema-inference advisory on integer training columns; the committed
    # feature columns are never null at training time (TotalCharges is imputed
    # upstream of this point), so this is advisory noise, not a real risk today.
    # ("." stands in for the literal colon after "Hint" — a literal colon here
    # would break pytest's 5-field colon-split of this ini entry.)
    "ignore:Hint. Inferred schema contains integer column:UserWarning",
    # test_eda.py's eda_df fixture models IBM Telco's real structural constraint
    # (internet add-on columns collapse to a single value when internetservice
    # is "No"), which makes compute_vif's default cat_cols design matrix
    # rank-deficient. Confirmed-benign: it's a property of the realistic fixture,
    # not of compute_vif itself, and fires incidentally in tests unrelated to
    # collinearity. Tests that specifically assert this warning use pytest.warns,
    # which still captures it under this filter.
    "ignore:VIF is inf for one or more features:UserWarning",
    # MLflow's SqlAlchemyStore (the sqlite:///... tracking URI ~20 test files
    # use) doesn't expose an explicit close for its underlying sqlite3
    # connection; it's released via garbage collection. Locally this surfaces
    # wrapped as pytest.PytestUnraisableExceptionWarning (pytest's own
    # unraisableexception plugin); under CI's Linux + pytest-xdist workers,
    # GC finalization timing differs enough that the identical leak instead
    # comes through the standard warnings path as a bare ResourceWarning —
    # same root cause, two categories, so both are ignored. Not a leak in
    # this project's own code either way.
    "ignore:unclosed database in <sqlite3.Connection:pytest.PytestUnraisableExceptionWarning",
    "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
]

[tool.coverage.run]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.uv]
override-dependencies = [
    # mlflow's pandas<3 metadata is stale; 3.x is compatible with pandas 3 at runtime.
    "pandas>=3.0.3",
]
