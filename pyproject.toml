[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "telcochurn-portfolioproject"
version = "0.1.0"
description = "Production-grade churn prediction system: Pandera validation, LightGBM + Optuna, MLflow registry, FastAPI serving, Prefect orchestration, AWS deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "kaggle>=2.2.0",
    "lightgbm>=4.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "optuna>=3.0",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0",
    "structlog>=25.5.0",
    "pandera>=0.18",
    "mlflow>=3.12.0",
    "pyarrow>=24.0.0",
    "shap>=0.44",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "hypothesis>=6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "testcontainers[postgres]>=4.0",
    "nbstripout>=0.9.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.2.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "pipelines/", "tests/"]

[[tool.mypy.overrides]]
module = "pandera.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "integration: integration tests that require Docker (pass --run-integration to run)",
]

[tool.coverage.run]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.uv]
override-dependencies = [
    # mlflow's pandas<3 metadata is stale; 3.x is compatible with pandas 3 at runtime.
    "pandas>=3.0.3",
]
