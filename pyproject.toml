[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "telcochurn-portfolioproject"
version = "0.1.0"
description = "Production-grade churn prediction system: Pandera validation, LightGBM + Optuna, MLflow registry, FastAPI serving, Prefect orchestration, AWS deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "kaggle>=2.2.0",
    "lightgbm>=4.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "optuna>=3.0",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0",
    "structlog>=25.5.0",
    "pandera>=0.18",
    "mlflow>=3.12.0",
    "pyarrow>=24.0.0",
    "shap>=0.44",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "hypothesis>=6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "testcontainers[postgres]>=4.0",
    "nbstripout>=0.9.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.2.0",
    "pytest-xdist>=3.8.0",
    "dvc>=3.67.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT", "TRY", "LOG", "PTH"]
ignore = ["E501", "TRY003", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["notebooks/", "pipelines/", "tests/"]

[[tool.mypy.overrides]]
module = "pandera.*"
follow_imports = "skip"

# Scoped, not the removed top-level ignore_missing_imports: only these libraries
# actually lack stubs/py.typed (confirmed by running mypy without the blanket
# flag). mlflow, optuna, and lightgbm already ship their own types and are
# checked normally; a typo in one of those import paths still surfaces as a
# real error instead of silently falling back to Any.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*", "sklearn.*", "shap", "joblib", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "integration: integration tests that require Docker (pass --run-integration to run)",
]
# Each entry below is a confirmed-benign warning, not an unexamined blanket
# silence — see CHANGELOG/PR history for the investigation. Message patterns
# are matched from the start of the string (regex, unescaped); keep them free
# of literal colons (pytest's ini parser splits the whole line on ":").
filterwarnings = [
    # LogisticRegression stand-ins for LightGBM in test_calibrate.py/test_threshold.py
    # deliberately keep the real, unscaled tree-family ColumnTransformer (they
    # exercise calibrate.py's/threshold.py's own CV-wrapping logic, not model
    # quality) — confirmed this still fires at max_iter=2000. Not reachable from
    # production configs: configs/training/logreg.yaml sets max_iter=200, and
    # scales the data via the real preprocessing pipeline these test stand-ins skip.
    "ignore:lbfgs failed to converge:sklearn.exceptions.ConvergenceWarning",
    # mlflow 3.14's own dataset digest computation still calls DataFrame.map(...).all(0)
    # positionally; nothing in this project touches that call site. Scoped to mlflow's
    # own module so a genuine Pandas4Warning from this project's own pandas code (e.g.
    # once pandas 4 actually ships) still surfaces instead of being swallowed here too.
    "ignore::pandas.errors.Pandas4Warning:mlflow.*",
    # mlflow.data.from_pandas's source-type registry reports the same source
    # string as matching two internally-duplicated LocalArtifactDatasetSource
    # registrations and self-resolves the ambiguity; not something callers can
    # disambiguate from the public from_pandas API.
    "ignore:The specified dataset source can be interpreted in multiple ways:UserWarning",
    # mlflow's schema-inference advisory on integer training columns; the committed
    # feature columns are never null at training time (TotalCharges is imputed
    # upstream of this point), so this is advisory noise, not a real risk today.
    # ("." stands in for the literal colon after "Hint" — a literal colon here
    # would break pytest's 5-field colon-split of this ini entry.)
    "ignore:Hint. Inferred schema contains integer column:UserWarning",
    # test_eda.py's eda_df fixture models IBM Telco's real structural constraint
    # (internet add-on columns collapse to a single value when internetservice
    # is "No"), which makes compute_vif's default cat_cols design matrix
    # rank-deficient. Confirmed-benign: it's a property of the realistic fixture,
    # not of compute_vif itself, and fires incidentally in tests unrelated to
    # collinearity. Tests that specifically assert this warning use pytest.warns,
    # which still captures it under this filter.
    "ignore:VIF is inf for one or more features:UserWarning",
]

[tool.coverage.run]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.uv]
override-dependencies = [
    # mlflow's pandas<3 metadata is stale; 3.x is compatible with pandas 3 at runtime.
    "pandas>=3.0.3",
]
